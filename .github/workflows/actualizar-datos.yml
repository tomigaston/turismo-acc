name: Verificación del tablero
# Solo verifica los datos ya commiteados (pruebas, smoke y sintaxis): no descarga ni publica nada.
# La descarga automática dejó de ser posible: datos.yvera.gob.ar redirige a data-turismo.jefatura.gob.ar,
# protegido por Cloudflare con verificación humana. La actualización es manual (ver README, sección 5).
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar integridad y cálculos (Python)
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxis de JavaScript
        run: |
          node --check site/app.js
          node --check site/model.js
          node --check site/hotel.js
          node --check site/hotel-model.js
      - name: Pruebas de JavaScript y smoke de la interfaz (jsdom)
        run: npm ci && npm test
